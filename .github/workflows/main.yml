name: Build Electron Multi-Arch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./MoYu/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install dependencies
        run: npm install
        working-directory: MoYu

      - name: Build frontend (if any)
        run: npm run build
        working-directory: MoYu

      - name: Build Electron app
        run: npx electron-builder --mac --universal --publish never
        working-directory: MoYu

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: MoYu v${{ steps.get_version.outputs.version }}
          files: |
            MoYu/release/*.dmg
