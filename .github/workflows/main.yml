name: Build Electron Multi-Arch

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: universal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./MoYu/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install dependencies
        run: npm install
        working-directory: MoYu

      - name: Build frontend (if any)
        run: npm run build
        working-directory: MoYu

      - name: Build Electron app
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --win --x64 --publish never
          else
            npx electron-builder --mac --universal --publish never
          fi
        working-directory: MoYu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoYu-${{ matrix.os }}-v${{ steps.get_version.outputs.version }}-${{ matrix.arch }}
          path: |
            MoYu/release/*.exe
            MoYu/release/*.msi
            MoYu/release/*.dmg
            MoYu/release/*.pkg
