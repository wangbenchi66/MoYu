name: 打包推送到 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先创建 Release（后续 build job 直接上传产物，不再依赖 artifact 中转）
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(node -p "require('./MoYu/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: MoYu v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: universal
            build_args: --mac --universal
          - os: windows-latest
            arch: x64
            build_args: --win --x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: MoYu

      - name: 构建前端
        run: npm run build
        working-directory: MoYu

      - name: 打包 Electron 应用
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        working-directory: MoYu

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            MoYu/release/*.dmg
            MoYu/release/*.exe
