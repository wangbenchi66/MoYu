name: Build Electron Multi-Arch

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        arch: [x64, arm64]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./MoYu/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install dependencies
        run: npm install
        working-directory: MoYu

      - name: Build frontend (if any)
        run: npm run build
        working-directory: MoYu

      - name: Build Electron app
        run: npx electron-builder --${{ runner.os == 'Windows' && 'win' || 'mac' }} --${{ matrix.arch }}
        working-directory: MoYu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoYu-${{ matrix.os }}-v${{ steps.get_version.outputs.version }}-${{ matrix.arch }}
          path: |
            MoYu/release/*.exe
            MoYu/release/*.msi
            MoYu/release/*.dmg
            MoYu/release/*.AppImage
            MoYu/release/*.zip
            MoYu/release/*.deb
            MoYu/release/*.rpm
            MoYu/release/*.pkg
