name: 打包推送到 Release

# ─────────────────────────────────────────────────────────────────────
#  触发条件
#    1. 推送 v* 形式的 tag（如 v0.0.6）→ 自动打包并发布 Release
#    2. 手动触发（Actions 页面点 Run workflow）→ 用于重跑
#
#  只对仓库所有者生效：见 guard job。别人 fork 后照抄这个 workflow
#  并推 tag 也不会产生任何 Release（详见 guard 的注释）。
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────
  #  守卫：确认是仓库所有者本人的操作
  #
  #  为什么需要它：on.push.tags 是仓库级配置。别人 fork 之后，
  #  那份副本里的 workflow 文件同样存在，对方打 tag 推送时
  #  会在**他自己的仓库**里跑一次（消耗他的额度）。
  #  如果没有这层判断，那个流程会尝试创建 Release —— 虽然落在他的
  #  仓库上、动不了你的代码，但会产生一个看似"官方"的构建产物，
  #  而且版本号、签名、更新源都可能被你这边误认。
  #
  #  两道判断：
  #    repository 必须等于 wangbenchi66/MoYu
  #    tag 推送者（github.actor）必须是 wangbenchi66
  #  手动触发（workflow_dispatch）时 github.actor 是当前登录用户，
  #  同样受第二条约束——协作者也无法手动跑发布。
  # ───────────────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}

    steps:
      - name: 校验仓库与触发者
        id: check
        run: |
          OWNER_REPO="wangbenchi66/MoYu"
          OWNER_ACTOR="wangbenchi66"

          echo "repository = ${{ github.repository }}"
          echo "actor      = ${{ github.actor }}"
          echo "ref        = ${{ github.ref }}"

          if [ "${{ github.repository }}" != "$OWNER_REPO" ]; then
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "::notice::跳过：仓库不是 ${OWNER_REPO}（这是 fork 或镜像仓库）"
            exit 0
          fi

          if [ "${{ github.actor }}" != "$OWNER_ACTOR" ]; then
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "::notice::跳过：触发者 ${{ github.actor }} 不是 $OWNER_ACTOR"
            exit 0
          fi

          echo "allowed=true" >> $GITHUB_OUTPUT
          echo "::notice::校验通过，开始打包"

  # ───────────────────────────────────────────────────────────────────
  #  确定发布版本 + 创建 Release
  #
  #  版本号以 **tag 为唯一真相**，不再要求 package.json 与之保持一致。
  #  原因：tags 是发布时决定的，而 package.json 是提交时固定的，
  #  两者天然容易分叉。此前用"强制一致 + 不一致就报错"来防错，
  #  代价是每次发版都要先改 package.json、提交、再打 tag。
  #
  #  现在改成：tag 是什么版本，发布就是什么版本。
  #  打包前由 build job 用 tag 版本覆写 package.json，
  #  从而让 electron-builder 生成的 latest.yml 也带上正确的版本号。
  # ───────────────────────────────────────────────────────────────────
  create-release:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      # fetch-depth: 0 —— 必须取完整历史。
      #
      # 下面要用 `git describe --tags` 找上一个 tag、用 `git log prev..tag`
      # 汇总本次提交，从而自动生成发布说明。
      # checkout 默认是浅克隆（depth=1，只有 1 个提交），
      # 在这种仓库里 git describe 会失败、git log 区间取不到东西，
      # 生成出来的说明会是空的。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号（以 tag 为准）
        id: get_version
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            # 去掉前缀 v，得到纯版本号：v0.0.6 → 0.0.6
            VERSION="${TAG#v}"
            echo "来源: tag  $TAG"
          else
            # 手动触发（workflow_dispatch）时没有 tag，退回读 package.json
            VERSION=$(node -p "require('./MoYu/package.json').version")
            echo "来源: package.json（手动触发，无 tag）"
          fi

          # 版本号必须是合法 semver，否则 electron-updater 无法比较大小。
          # 允许 1.2.3 / 1.2.3-beta.1 这类形式。
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号 '$VERSION' 不是合法的 semver"
            echo "::error::tag 应形如 v1.2.3 或 v1.2.3-beta.1"
            exit 1
          fi

          echo "发布版本 = $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ── 生成发布说明 ──
      #
      # 目标：Release 页面上只显示**大概的说明**，不铺陈提交明细。
      #
      # 优先用这个 tag 的 annotated 描述（git tag -a -m "..."）。
      # 那段文字是面向用户写的概述——本版做了什么、有什么注意事项，
      # 正好适合直接作为 Release body。
      #
      # 只在 tag 没写描述时，才回退到「提交标题列表」（- %s）。
      # 注意回退路径**只取标题**，不取正文：本仓库的 commit 正文
      # 动辄几十行（问题/修复/验证分节），全贴到 Release 上会非常冗长。
      # 想看细节的人去看提交记录，Release 页只负责讲清楚"这版变了什么"。
      #
      # 为什么不用 GitHub 的 generate_release_notes：
      #   它会自动生成 "What's Changed"，格式与措辞都不受控；
      #   而这里想要的是自己能完全决定的一段概述。
      - name: 生成发布说明
        id: notes
        shell: bash
        run: |
          set -uo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"

          # 上一个 tag（用 TAG^ 排除自身；没有则说明是首个版本）
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "提交范围: ${PREV} → ${TAG}"
            RANGE="${PREV}..${TAG}"
          else
            echo "提交范围: 首个版本 → ${TAG}"
            RANGE="${TAG}"
          fi

          COUNT=$(git rev-list --count --no-merges "$RANGE" 2>/dev/null || echo 0)
          echo "提交数: ${COUNT}"

          # 判断 tag 类型。
          # ⚠️ 必须看类型，不能只看 `git tag -l --format='%(contents)'` 是否非空：
          # 对**轻量 tag**，%(contents) 返回的是它指向的 commit message，
          # 于是永远判为"有描述"，回退分支成了死代码。（实测 v0.0.2 就是这种情况）
          #   annotated tag → cat-file -t 返回 "tag"
          #   轻量 tag      → 返回 "commit"
          TAGTYPE=$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || echo "unknown")
          echo "tag 类型: ${TAGTYPE}"

          {
            if [ "${TAGTYPE}" = "tag" ]; then
              # 主路径：annotated tag → 用它自己的描述
              printf '%s\n' "$(git tag -l --format='%(contents)' "$TAG")"
            else
              # 回退：轻量 tag（或未知）→ 列提交标题，不含正文
              printf '%s\n\n' '## 更新内容'
              if [ "${COUNT}" = "0" ]; then
                printf '%s\n' '_本次没有新提交_'
              else
                git log --no-merges --format='- %s' "$RANGE"
              fi
            fi
          } > release-notes.md

          # 诊断信息走 stderr，避免混进 release-notes.md
          # （这些 echo 若放在 { } 块内会被一并重定向进文件）
          if [ "${TAGTYPE}" = "tag" ]; then
            echo "使用 tag 描述作为发布说明" >&2
          else
            echo "tag 无描述，回退到提交标题列表" >&2
          fi

          echo "" >&2
          echo "=== 生成结果 ===" >&2
          cat release-notes.md >&2
          echo "" >&2
          echo "=== 共 $(wc -l < release-notes.md) 行 / $(wc -c < release-notes.md) 字节 ===" >&2

          if [ ! -s release-notes.md ]; then
            echo "::error::release-notes.md 为空，生成逻辑异常"
            exit 1
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: MoYu v${{ steps.get_version.outputs.version }}
          # 用上一步生成的说明（自动来自 commit 描述）
          body_path: release-notes.md
          # 必须是非 draft：electron-updater 通过 GitHub API 查 latest release，
          # draft 版本对它不可见，会导致「检查更新」永远返回已是最新。
          draft: false

  # ───────────────────────────────────────────────────────────────────
  #  多平台构建
  # ───────────────────────────────────────────────────────────────────
  build:
    needs: [guard, create-release]
    if: needs.guard.outputs.allowed == 'true'
    strategy:
      # 一个平台失败时不取消另一个，便于单独看哪个平台的日志
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: universal
            build_args: --mac --universal
          - os: windows-latest
            arch: x64
            build_args: --win --x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: MoYu/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: MoYu

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('MoYu/package-lock.json') }}
          restore-keys: electron-${{ matrix.os }}-

      - name: 构建前端
        run: npm run build
        working-directory: MoYu

      # ── 关键步骤：把 tag 版本写进 package.json ──
      #
      # 为什么需要：latest.yml / latest-mac.yml 由 electron-builder 生成，
      # 其中的 version 字段取自 `packager.appInfo.version`，也就是
      # **package.json 的 version**——它看不到 git tag。
      #
      # 若不改写，tag v0.0.6 打出来但 package.json 还写着 0.0.5 时，
      # latest.yml 会写 0.0.5，electron-updater 比对后认为"没有新版本"，
      # 自动更新**静默失效**（用户端毫无报错，最难排查的一类问题）。
      #
      # 这里用 tag 推导出的版本覆写，保证 latest.yml 与 Release 一致。
      # 只改 CI 工作区里的文件，不会提交回仓库。
      #
      # --no-git-tag-version: 不让 npm 顺手打 tag / 提交；
      # --allow-same-version: 版本号恰好相同时不报错（重跑工作流会遇到）。
      #
      # 注意：npm version 会连带把 package-lock.json 里的 version 也改掉。
      # 这没有影响——依赖早已由上面的 `npm ci` 装好，且改动只留在 CI 工作区。
      #
      # ⚠️ 必须写成**单行**，并且显式指定 shell: bash。
      #
      # 原因：这个 job 在 windows-latest 上跑，GitHub Actions 的**默认 shell 是
      # PowerShell**，而 PowerShell 里行尾的 `\` 不是续行符（那是 bash 语法）。
      # 写成跨行时，下一行的 `--no-git-tag-version` 会被当成一元 `--` 运算符，
      # 报错：Missing expression after unary operator '--'。
      #
      # create-release 在 ubuntu 上跑、默认就是 bash，所以同样的续行在那边没事——
      # 这是很容易漏掉的一处不对称。
      - name: 用 tag 版本覆写 package.json
        shell: bash
        run: npm version ${{ needs.create-release.outputs.version }} --no-git-tag-version --allow-same-version
        working-directory: MoYu

      - name: 确认版本已同步
        shell: bash
        run: |
          echo "create-release 输出的版本: ${{ needs.create-release.outputs.version }}"
          echo "package.json 实际版本   : $(node -p "require('./MoYu/package.json').version")"
        working-directory: .

      # 用 GitHub 官方 token 发布，避免 electron-builder 自己发布时
      # 与 create-release 步骤冲突（--publish never），
      # 但仍会生成 latest.yml / latest-mac.yml —— 这两个清单文件是
      # electron-updater 判断版本的依据，必须一并上传。
      - name: 打包 Electron 应用
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        working-directory: MoYu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 诊断：无论打包成功还是失败，都打印 release 目录的实际情况。
      # if: always() 保证打包步骤失败时也会执行 —— 否则最需要看内容的时候反而看不到。
      - name: 诊断 - 列出打包产物
        if: always()
        shell: bash
        run: |
          echo "platform = ${{ matrix.os }} / ${{ matrix.build_args }}"
          echo ""
          if [ -d MoYu/release ]; then
            echo "=== MoYu/release ==="
            ls -la MoYu/release/
          else
            echo "::warning::MoYu/release 目录不存在 —— 打包可能根本没有开始"
          fi
          echo ""
          echo "=== electron-builder 版本 ==="
          cd MoYu && npx electron-builder --version || echo "（无法获取版本）"

      # 打包完成后核对产物与清单：这是最后一道防线。
      #
      # ⚠️ 必须按平台**严格校验**，不能对缺失文件只发 warning。
      #
      # 原因：早先的实现对 latest.yml / latest-mac.yml 一视同仁，
      # 文件不存在就 `::warning::` 然后继续。看似"兼容每个平台只产出自己那份"，
      # 实际副作用是把**真正的打包失败静默放行**了 ——
      # 实测出现过：windows runner 上 latest.yml 根本不存在，
      # 校验却打印"✓ 通过"，随后把缺了 Windows 产物的 Release 当成成功。
      #
      # 现在：按 matrix.os 只认本平台应该产出的那个文件，缺失即 fail。
      - name: 校验本平台产物与清单版本
        shell: bash
        run: |
          set -uo pipefail
          EXPECTED="${{ needs.create-release.outputs.version }}"
          OS="${{ matrix.os }}"

          if [ "$OS" = "windows-latest" ]; then
            MANIFEST="MoYu/release/latest.yml"
            INSTALLER_GLOB="MoYu/release/*.exe"
            UPDATE_PKG_GLOB=""
            LABEL="Windows (.exe + latest.yml)"
          else
            MANIFEST="MoYu/release/latest-mac.yml"
            INSTALLER_GLOB="MoYu/release/*.dmg"
            # ⚠️ macOS 自动更新**只认 zip**，不认 dmg。
            # electron-updater 的 MacUpdater 里写的是：
            #     findFile(files, "zip", ["pkg", "dmg"])   ← 明确排除 dmg
            # 之前 mac.target 只配了 dmg，导致 latest-mac.yml 里没有 zip 条目，
            # macOS 端「检查更新」能查到新版本，但下载安装必然失败。
            # 现已在 package.json 的 mac.target 里加上 zip，并在这里强制校验。
            UPDATE_PKG_GLOB="MoYu/release/*.zip"
            LABEL="macOS (.dmg + .zip + latest-mac.yml)"
          fi

          echo "平台: $OS  →  期望产物: $LABEL"
          echo ""

          # ① 安装包必须存在
          shopt -s nullglob
          INSTALLERS=($INSTALLER_GLOB)
          shopt -u nullglob
          if [ ${#INSTALLERS[@]} -eq 0 ]; then
            echo "::error::未找到安装包（${INSTALLER_GLOB}）—— 打包步骤没有真正产出产物"
            echo "::error::请检查上一步「打包 Electron 应用」的完整日志"
            exit 1
          fi
          echo "安装包:"
          for f in "${INSTALLERS[@]}"; do
            echo "  $(basename "$f")  ($(du -h "$f" | cut -f1))"
          done

          # ② 本平台的更新清单必须存在
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST 不存在"
            echo "::error:::上述平台（${OS}）必须产出 ${MANIFEST}，否则 electron-updater 无法判断版本"
            echo "::error::常见原因：打包未成功、target 不是 nsis/dmg、或 --publish 参数异常"
            echo ""
            echo "release 目录实际内容："
            ls -la MoYu/release/ 2>/dev/null || echo "  （目录不存在）"
            exit 1
          fi

          # ③ 清单里的版本必须等于发布版本
          ACTUAL=$(grep -E '^version:' "$MANIFEST" | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          echo ""
          echo "$MANIFEST -> version: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::$MANIFEST 的版本 ($ACTUAL) 与发布版本 ($EXPECTED) 不一致"
            echo "::error::这会导致 electron-updater 认为没有新版本，自动更新静默失效"
            exit 1
          fi

          # ④ macOS 专项：自动更新依赖 zip，必须存在且已写进清单
          #
          # 这是 macOS 自动更新的前提条件，缺了它「检查更新」能查到新版本，
          # 但点下载后会失败（MacUpdater 找不到 zip）。
          if [ -n "$UPDATE_PKG_GLOB" ]; then
            shopt -s nullglob
            PKGS=($UPDATE_PKG_GLOB)
            shopt -u nullglob

            if [ ${#PKGS[@]} -eq 0 ]; then
              echo "::error::未找到 $UPDATE_PKG_GLOB —— macOS 自动更新需要 zip"
              echo "::error::请在 MoYu/package.json 的 build.mac.target 中加入 zip"
              exit 1
            fi
            echo ""
            echo "更新包（自动更新实际下载的）："
            for f in "${PKGS[@]}"; do
              echo "  $(basename "$f")  ($(du -h "$f" | cut -f1))"
            done

            if ! grep -qE '\.zip' "$MANIFEST"; then
              echo "::error::$MANIFEST 中没有 .zip 条目"
              echo "::error::说明打包时没有产出 zip target —— macOS 端将无法自动更新"
              echo ""
              echo "$MANIFEST 内容："
              cat "$MANIFEST"
              exit 1
            fi
            echo "  ✓ 清单已包含 .zip 条目"
          fi

          echo ""
          echo "✓ $OS 产物与清单校验通过（version: ${EXPECTED}）"

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            MoYu/release/*.dmg
            MoYu/release/*.zip
            MoYu/release/*.exe
            MoYu/release/*.blockmap
            MoYu/release/latest.yml
            MoYu/release/latest-mac.yml
          # 保持 false：各平台只产出自己那部分，
          # 匹配不到不算错（真正的产物完整性由上面「校验本平台产物」把关）
          fail_on_unmatched_files: false
