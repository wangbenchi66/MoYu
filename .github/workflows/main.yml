name: Build Electron Multi-Arch

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        arch: [x64, arm64]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # cache 已移除，避免锁文件报错

      - name: Install dependencies
        run: npm install
        working-directory: MoYu

      - name: Build frontend (if any)
        run: npm run build
        working-directory: MoYu

      - name: Build Electron app
        run: npx electron-builder --${{ runner.os == 'Windows' && 'win' || 'mac' }} --${{ matrix.arch }}
        working-directory: MoYu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.arch }}
          path: MoYu/dist/**
