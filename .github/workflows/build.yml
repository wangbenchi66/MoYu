name: Build Electron Multi-Arch

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: universal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm install
        working-directory: MoYu

      - run: npm run build
        working-directory: MoYu

      - name: Build Electron
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --win --x64 --publish never
          else
            npx electron-builder --mac --universal --publish never
          fi
        working-directory: MoYu
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoYu-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            MoYu/dist/*.exe
            MoYu/dist/*.msi
            MoYu/dist/*.dmg
            MoYu/dist/*.pkg

  # release job removed: this workflow only builds and uploads installer artifacts
